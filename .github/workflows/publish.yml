name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Resolves to randriksen/family-calendar, matching unraid-template.xml
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v1.2.3 -> 1.2.3, 1.2, latest. Pushes to main -> main + sha, and
          # latest, so Unraid's :latest always tracks the default branch.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          # metadata-action would otherwise overwrite the curated title and
          # description baked into the Dockerfile with the repo's own.
          labels: |
            org.opencontainers.image.title=Family Calendar
            org.opencontainers.image.description=Shared family calendar — aggregates iCal feeds from all family members into one wall-calendar view. Supports Google Calendar, iCloud, Outlook, and any iCal URL.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # better-sqlite3 is compiled from source, so adding linux/arm64 here
          # means a QEMU build and a much longer job. Unraid is amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
